<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#111827">

<title>Drain Video Converter</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f3f4f6;
  color: #111827;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

.container {
  max-width: 650px;
  margin: auto;
  padding: 24px 16px 50px;
}

header {
  text-align: center;
  padding: 10px 0 20px;
}

h1 {
  font-size: 34px;
  line-height: 1.1;
  margin: 5px 0 8px;
}

header p {
  color: #6b7280;
  margin: 0;
  font-size: 17px;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 20px;
  margin: 14px 0;
  box-shadow: 0 2px 12px rgba(0,0,0,.08);
}

/* IMPORTANT:
   The file input is NOT display:none.
   This is intentional for iPhone/iPad compatibility.
*/

.file-area {
  position: relative;
  width: 100%;
  min-height: 70px;
}

.file-button {
  width: 100%;
  min-height: 70px;
  border-radius: 15px;
  background: #111827;
  color: white;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 19px;
  font-weight: 800;

  user-select: none;
  -webkit-user-select: none;
}

#file {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  opacity: 0;

  cursor: pointer;

  /* Do NOT use display:none here */
}

#filename {
  margin-top: 13px;
  color: #4b5563;
  font-size: 16px;
  line-height: 1.4;
  word-break: break-word;
}

.setting {
  display: block;
  margin: 20px 0;
  font-weight: 700;
}

select {
  width: 100%;
  margin-top: 8px;

  padding: 14px;

  border: 1px solid #d1d5db;
  border-radius: 12px;

  background: white;

  font-size: 16px;
}

button {
  width: 100%;

  border: 0;
  border-radius: 15px;

  padding: 17px;

  font-size: 18px;
  font-weight: 800;

  background: #2563eb;
  color: white;

  -webkit-appearance: none;
  appearance: none;
}

button:disabled {
  background: #9ca3af;
}

#status {
  margin-top: 15px;

  color: #4b5563;

  min-height: 26px;

  line-height: 1.4;
}

.progress {
  height: 11px;

  background: #e5e7eb;

  border-radius: 99px;

  overflow: hidden;

  margin-top: 14px;

  display: none;
}

#bar {
  height: 100%;
  width: 0%;

  background: #2563eb;

  transition: width .15s linear;
}

.result {
  margin-top: 14px;
}

.result h2 {
  margin-top: 0;
}

.result-info {
  color: #4b5563;
  line-height: 1.5;
  word-break: break-word;
}

.action-button {
  margin-top: 14px;
}

.secondary {
  background: #111827;
}

.hidden {
  display: none !important;
}

footer {
  text-align: center;

  color: #9ca3af;

  font-size: 12px;

  line-height: 1.5;

  margin-top: 22px;
}

.notice {
  margin-top: 12px;

  padding: 12px;

  border-radius: 12px;

  background: #f9fafb;

  color: #6b7280;

  font-size: 13px;

  line-height: 1.4;
}
</style>
</head>

<body>

<div class="container">

<header>
  <h1>Drain Video Converter</h1>
  <p>VEVOR AVI → Customer MP4</p>
</header>


<div class="card">

  <!-- FILE PICKER -->

  <div class="file-area">

    <div class="file-button">
      Choose AVI Video
    </div>

    <!--
      IMPORTANT:
      This input is transparent, NOT display:none.
      That makes it much more reliable on iPhone/iPad.
      
      We intentionally allow all file types here because
      some iOS versions do not properly report unusual AVI
      MIME types from the Files app.
    -->

    <input
      id="file"
      type="file"
      accept="*/*"
      aria-label="Choose AVI video"
    >

  </div>


  <div id="filename">
    No video selected
  </div>


  <label class="setting">

    Video quality

    <select id="quality">

      <option value="23">
        Customer — Best Balance
      </option>

      <option value="20">
        Higher Quality — Larger File
      </option>

      <option value="26">
        Smaller File
      </option>

    </select>

  </label>


  <button id="convert" disabled>
    Convert for Customer
  </button>


  <div class="progress">
    <div id="bar"></div>
  </div>


  <div id="status">
    Select an AVI video to begin.
  </div>


  <div class="notice">
    Your video is processed on this device.
    The video is not uploaded to a conversion service.
  </div>

</div>


<!-- RESULT -->

<div id="result" class="card hidden">

  <h2>✓ MP4 Ready</h2>

  <div
    id="resultInfo"
    class="result-info"
  ></div>


  <button
    id="shareButton"
    class="action-button secondary"
  >
    Save / Share MP4
  </button>


  <button
    id="againButton"
    class="action-button hidden"
  >
    Convert Another Video
  </button>

</div>


<footer>
  Drain Video Converter
</footer>

</div>


<!-- FFmpeg -->

<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>


<script>

"use strict";


/* =========================================================
   ELEMENTS
========================================================= */

const fileInput =
  document.getElementById("file");

const filename =
  document.getElementById("filename");

const convertButton =
  document.getElementById("convert");

const statusText =
  document.getElementById("status");

const progressBox =
  document.querySelector(".progress");

const progressBar =
  document.getElementById("bar");

const resultBox =
  document.getElementById("result");

const resultInfo =
  document.getElementById("resultInfo");

const shareButton =
  document.getElementById("shareButton");

const againButton =
  document.getElementById("againButton");

const quality =
  document.getElementById("quality");


/* =========================================================
   STATE
========================================================= */

let selectedFile = null;

let ffmpeg = null;

let ffmpegLoaded = false;

let outputBlob = null;

let outputFile = null;

let outputURL = null;


/* =========================================================
   HELPERS
========================================================= */

function formatBytes(bytes) {

  if (!Number.isFinite(bytes)) {
    return "";
  }

  if (bytes < 1024 * 1024) {
    return Math.max(
      1,
      Math.round(bytes / 1024)
    ) + " KB";
  }

  return (
    bytes /
    1024 /
    1024
  ).toFixed(1) + " MB";
}


function safeName(name) {

  return name
    .replace(/\.[^.]+$/, "")
    .replace(/[^a-zA-Z0-9_-]+/g, "_")
    .replace(/^_+|_+$/g, "")
    .slice(0, 70) || "Drain_Video";
}


function isAVI(file) {

  if (!file) {
    return false;
  }

  const name =
    String(file.name || "")
      .toLowerCase();

  return name.endsWith(".avi");
}


function resetResult() {

  resultBox.classList.add("hidden");

  resultInfo.textContent = "";

  againButton.classList.add("hidden");

  outputBlob = null;

  outputFile = null;

  if (outputURL) {

    URL.revokeObjectURL(outputURL);

    outputURL = null;
  }
}


/* =========================================================
   FILE SELECTION
========================================================= */

/*
  Clear the input immediately before opening it.

  This is important because if the user selects the same
  AVI twice, iOS may otherwise decide that nothing changed.
*/

fileInput.addEventListener(
  "click",
  function() {

    fileInput.value = "";

  },
  false
);


/*
  Main file-selection event.
*/

fileInput.addEventListener(
  "change",
  function(event) {

    const files =
      event.target.files;

    const file =
      files && files.length
        ? files[0]
        : null;


    resetResult();


    if (!file) {

      selectedFile = null;

      filename.textContent =
        "No video selected";

      convertButton.disabled = true;

      statusText.textContent =
        "No file was selected.";

      return;
    }


    /*
      Validate AVI ourselves instead of relying on
      the iPhone's MIME type.
    */

    if (!isAVI(file)) {

      selectedFile = null;

      filename.textContent =
        "Please choose an AVI video.";

      convertButton.disabled = true;

      statusText.textContent =
        "That file does not appear to be an AVI video.";

      return;
    }


    selectedFile = file;


    filename.textContent =
      file.name +
      " • " +
      formatBytes(file.size);


    convertButton.disabled = false;


    statusText.textContent =
      "AVI selected. Tap Convert for Customer.";

  },
  false
);


/*
  Also listen for the input event.

  Some iOS/Safari versions behave differently with
  file controls, so this gives us another route.
*/

fileInput.addEventListener(
  "input",
  function(event) {

    if (
      !selectedFile &&
      event.target.files &&
      event.target.files.length
    ) {

      const file =
        event.target.files[0];

      if (isAVI(file)) {

        selectedFile = file;

        filename.textContent =
          file.name +
          " • " +
          formatBytes(file.size);

        convertButton.disabled = false;

        statusText.textContent =
          "AVI selected. Tap Convert for Customer.";
      }

    }

  },
  false
);


/* =========================================================
   LOAD FFMPEG
========================================================= */

async function loadConverter() {

  if (ffmpegLoaded) {
    return;
  }


  statusText.textContent =
    "Preparing converter…";


  const FFmpegClass =
    window.FFmpeg &&
    window.FFmpeg.FFmpeg;


  const util =
    window.FFmpegUtil;


  if (!FFmpegClass) {

    throw new Error(
      "FFmpeg library did not load."
    );
  }


  if (!util) {

    throw new Error(
      "FFmpeg utility library did not load."
    );
  }


  const fetchFile =
    util.fetchFile;

  const toBlobURL =
    util.toBlobURL;


  ffmpeg =
    new FFmpegClass();


  /*
    Show FFmpeg messages in the status area.
  */

  ffmpeg.on(
    "log",
    function(data) {

      if (
        data &&
        data.message
      ) {

        const message =
          data.message;

        /*
          Only show useful messages.
        */

        if (
          message.includes("frame=") ||
          message.includes("size=") ||
          message.includes("time=") ||
          message.includes("video:")
        ) {

          statusText.textContent =
            "Converting video…";

        }

      }

    }
  );


  /*
    Progress indicator.
  */

  ffmpeg.on(
    "progress",
    function(data) {

      if (
        data &&
        typeof data.progress === "number"
      ) {

        let percent =
          Math.round(
            data.progress * 100
          );


        percent =
          Math.max(
            0,
            Math.min(
              100,
              percent
            )
          );


        progressBox.style.display =
          "block";

        progressBar.style.width =
          percent + "%";


        statusText.textContent =
          "Converting… " +
          percent +
          "%";

      }

    }
  );


  /*
    Official ffmpeg.wasm 0.12.10 UMD core.
  */

  const baseURL =
    "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/umd";


  statusText.textContent =
    "Loading video converter…";


  await ffmpeg.load({

    coreURL:
      await toBlobURL(
        baseURL +
        "/ffmpeg-core.js",
        "text/javascript"
      ),

    wasmURL:
      await toBlobURL(
        baseURL +
        "/ffmpeg-core.wasm",
        "application/wasm"
      )

  });


  ffmpegLoaded = true;


  statusText.textContent =
    "Converter ready.";

}


/* =========================================================
   CONVERT
========================================================= */

convertButton.addEventListener(
  "click",
  async function() {

    if (!selectedFile) {

      statusText.textContent =
        "Please select an AVI video first.";

      return;
    }


    convertButton.disabled = true;

    progressBox.style.display =
      "block";

    progressBar.style.width =
      "0%";

    resetResult();


    try {

      /*
        Load FFmpeg.
      */

      await loadConverter();


      /*
        Give every input a unique name.
      */

      const timestamp =
        Date.now();


      const inputName =
        "input_" +
        timestamp +
        ".avi";


      const outputName =
        safeName(
          selectedFile.name
        ) +
        "_Customer.mp4";


      statusText.textContent =
        "Reading AVI file…";


      /*
        Read the selected iPhone file
        into FFmpeg's local filesystem.
      */

      const util =
        window.FFmpegUtil;


      const fileData =
        await util.fetchFile(
          selectedFile
        );


      await ffmpeg.writeFile(
        inputName,
        fileData
      );


      statusText.textContent =
        "Converting video…";


      /*
        Convert to broadly compatible MP4:

        H.264 video
        AAC audio
        yuv420p
        faststart

        These settings are designed for easy
        playback and sharing from an iPhone.
      */

      const resultCode =
        await ffmpeg.exec([

          "-i",
          inputName,

          "-map",
          "0:v:0",

          "-map",
          "0:a:0?",

          "-c:v",
          "libx264",

          "-preset",
          "veryfast",

          "-crf",
          quality.value,

          "-pix_fmt",
          "yuv420p",

          "-c:a",
          "aac",

          "-b:a",
          "128k",

          "-movflags",
          "+faststart",

          outputName

        ]);


      if (
        typeof resultCode === "number" &&
        resultCode !== 0
      ) {

        throw new Error(
          "FFmpeg returned code " +
          resultCode
        );

      }


      statusText.textContent =
        "Preparing MP4…";


      /*
        Read the finished MP4.
      */

      const data =
        await ffmpeg.readFile(
          outputName
        );


      /*
        Create a normal browser Blob.
      */

      outputBlob =
        new Blob(
          [data.buffer],
          {
            type: "video/mp4"
          }
        );


      outputFile =
        new File(
          [outputBlob],
          outputName,
          {
            type: "video/mp4"
          }
        );


      /*
        Create a temporary URL.
      */

      outputURL =
        URL.createObjectURL(
          outputBlob
        );


      /*
        Display result.
      */

      resultInfo.textContent =
        outputName +
        " • " +
        formatBytes(
          outputBlob.size
        );


      resultBox.classList.remove(
        "hidden"
      );


      againButton.classList.remove(
        "hidden"
      );


      progressBar.style.width =
        "100%";


      statusText.textContent =
        "Finished! Your MP4 is ready.";


      /*
        Clean the input/output files
        out of FFmpeg's virtual filesystem.
      */

      await ffmpeg.deleteFile(
        inputName
      ).catch(
        function() {}
      );


      await ffmpeg.deleteFile(
        outputName
      ).catch(
        function() {}
      );


    } catch (error) {

      console.error(error);


      progressBar.style.width =
        "0%";


      statusText.textContent =
        "Conversion failed.";


      let message =
        "Conversion failed.";


      if (
        error &&
        error.message
      ) {

        message +=
          "\n\n" +
          error.message;
      }


      alert(message);


    } finally {

      convertButton.disabled =
        !selectedFile;

    }

  }
);


/* =========================================================
   SAVE / SHARE
========================================================= */

shareButton.addEventListener(
  "click",
  async function() {

    if (!outputBlob || !outputFile) {

      return;
    }


    try {

      /*
        Best experience on iPhone:
        use the native Share Sheet.
      */

      if (
        navigator.share &&
        navigator.canShare
      ) {

        const shareData = {
          files: [outputFile],
          title: "Drain Video MP4",
          text: "Converted drain inspection video."
        };


        if (
          navigator.canShare(
            shareData
          )
        ) {

          await navigator.share(
            shareData
          );

          return;
        }

      }


      /*
        Fallback:
        open the MP4 in Safari.
      */

      if (outputURL) {

        window.location.href =
          outputURL;

      }

    } catch (error) {

      /*
        User cancelling the iPhone
        Share Sheet is not an error
        we need to show.
      */

      if (
        error &&
        error.name ===
        "AbortError"
      ) {

        return;
      }


      console.error(error);


      if (outputURL) {

        window.location.href =
          outputURL;

      }

    }

  }
);


/* =========================================================
   CONVERT ANOTHER VIDEO
========================================================= */

againButton.addEventListener(
  "click",
  function() {

    selectedFile = null;

    fileInput.value = "";

    filename.textContent =
      "No video selected";

    convertButton.disabled = true;

    progressBox.style.display =
      "none";

    progressBar.style.width =
      "0%";

    resetResult();

    statusText.textContent =
      "Select an AVI video to begin.";

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }
);

</script>

</body>
</html>
