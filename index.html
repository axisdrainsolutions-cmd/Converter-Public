<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Drain Converter" />
    <meta
      name="description"
      content="Convert drain and sewer inspection camera AVI recordings to customer-ready MP4 files. Runs entirely on your device."
    />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-180.png" />
    <title>Drain Video Converter</title>
  </head>
  <body>
    <main class="app">
      <header class="head">
        <h1>Drain Video Converter</h1>
        <p class="sub">VEVOR AVI → Customer MP4</p>
      </header>

      <!--
        The input is a real <input type="file">, layered transparently on top of
        the visible button rather than hidden with display:none. iOS Safari is
        picky about opening the Files picker from a synthesised click on a
        hidden input; a real tap that lands on the real input always works.
      -->
      <div class="picker" id="picker">
        <button type="button" class="btn btn-choose" id="chooseBtn">
          Choose AVI Video
        </button>
        <input
          type="file"
          id="fileInput"
          class="file-input"
          accept="*/*"
          aria-label="Choose AVI video"
        />
      </div>

      <p class="file-meta" id="fileMeta" hidden></p>

      <section class="panel" id="optionsPanel" hidden>
        <label class="field-label" for="quality">Output quality</label>
        <select id="quality" class="select">
          <option value="original" selected>Customer — Fast (Original Quality)</option>
          <option value="smaller">Smaller File — Slower</option>
          <option value="smallest">Smallest File — Slowest</option>
        </select>

        <button type="button" class="btn btn-primary" id="convertBtn" disabled>
          Convert for Customer
        </button>
      </section>

      <section class="progress-wrap" id="progressWrap" hidden>
        <div
          class="progress"
          role="progressbar"
          aria-valuemin="0"
          aria-valuemax="100"
          id="progressBar"
        >
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </section>

      <p class="status" id="status" role="status" aria-live="polite"></p>

      <section class="panel result" id="resultPanel" hidden>
        <p class="result-title">MP4 conversion complete</p>
        <p class="file-meta" id="resultMeta"></p>
        <button type="button" class="btn btn-primary" id="shareBtn">
          Save / Share MP4
        </button>
        <p class="hint" id="shareHint"></p>
      </section>

      <section class="panel error" id="errorPanel" hidden>
        <p class="error-text" id="errorText"></p>
        <button type="button" class="btn btn-ghost" id="retryBtn">Try Again</button>
      </section>

      <p class="notice">
        Your video is converted directly on this device.<br />
        The AVI is not uploaded to a conversion service.
      </p>

      <section class="panel debug" id="debugPanel" hidden>
        <h2>Diagnostics</h2>
        <pre id="debugInfo"></pre>
        <h2>FFmpeg log</h2>
        <pre id="debugLog"></pre>
        <button type="button" class="btn btn-ghost" id="copyDebugBtn">
          Copy diagnostics
        </button>
      </section>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
