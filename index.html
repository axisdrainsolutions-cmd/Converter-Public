<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#111827">

<title>Drain Video Converter</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f3f4f6;
  color: #111827;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.container {
  max-width: 650px;
  margin: 0 auto;
  padding: 25px 16px 45px;
}

header {
  text-align: center;
  padding: 10px 0 20px;
}

h1 {
  font-size: 34px;
  line-height: 1.1;
  margin: 5px 0;
}

header p {
  color: #6b7280;
  margin: 8px 0 0;
  font-size: 17px;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 20px;
  margin: 14px 0;
  box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
}

/* REAL iPHONE FILE BUTTON */

.fileButton {
  display: block;
  width: 100%;
  padding: 18px;
  border: 0;
  border-radius: 15px;
  background: #111827;
  color: white;
  text-align: center;
  font-weight: 800;
  font-size: 18px;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
}

.fileButton:active {
  opacity: 0.85;
}

.fileButton input {
  display: block;
  width: 100%;
  margin-top: 12px;
  color: white;
  font-size: 16px;
}

/*
  Do NOT hide the input.
  iPhone needs to interact with the real
  file input control.
*/

#filename {
  margin-top: 14px;
  color: #6b7280;
  word-break: break-word;
  line-height: 1.4;
}

#fileDetails {
  margin-top: 5px;
  color: #9ca3af;
  font-size: 14px;
}

/* SETTINGS */

label.setting {
  display: block;
  margin: 20px 0;
  font-weight: 600;
}

select {
  width: 100%;
  margin-top: 8px;
  padding: 13px;
  border: 1px solid #d1d5db;
  border-radius: 11px;
  background: white;
  color: #111827;
  font-size: 16px;
}

/* BUTTONS */

button {
  width: 100%;
  border: 0;
  border-radius: 15px;
  padding: 17px;
  font-size: 18px;
  font-weight: 800;
  background: #2563eb;
  color: white;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
}

button:disabled {
  background: #9ca3af;
  cursor: default;
}

.shareButton {
  background: #111827;
  margin-top: 12px;
}

.downloadButton {
  display: block;
  width: 100%;
  margin-top: 12px;
  padding: 15px;
  border-radius: 13px;
  background: #6b7280;
  color: white;
  text-align: center;
  text-decoration: none;
  font-weight: 800;
}

/* STATUS */

#status {
  margin-top: 15px;
  color: #4b5563;
  min-height: 25px;
  line-height: 1.4;
}

.progress {
  height: 11px;
  background: #e5e7eb;
  border-radius: 99px;
  overflow: hidden;
  margin-top: 14px;
  display: none;
}

#bar {
  height: 100%;
  width: 0%;
  background: #2563eb;
  transition: width 0.15s ease;
}

/* RESULT */

.result h2 {
  margin-top: 0;
}

#resultInfo {
  color: #4b5563;
  line-height: 1.5;
  word-break: break-word;
}

.hidden {
  display: none !important;
}

footer {
  text-align: center;
  color: #9ca3af;
  font-size: 12px;
  line-height: 1.5;
  margin-top: 22px;
}

@media (max-width: 400px) {
  h1 {
    font-size: 30px;
  }

  .card {
    padding: 17px;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <h1>Drain Video Converter</h1>
  <p>VEVOR AVI → Customer MP4</p>
</header>


<div class="card">

  <!--
    IMPORTANT:
    This is a normal, visible iPhone file input.
    We intentionally do not hide it.
  -->

  <div class="fileButton">

    Choose AVI Video

    <input
      id="file"
      type="file"
      accept="*/*"
    >

  </div>


  <div id="filename">
    No video selected
  </div>

  <div id="fileDetails"></div>


  <label class="setting">

    Video quality

    <select id="quality">

      <option value="23">
        Customer — Best Balance
      </option>

      <option value="20">
        Higher Quality — Larger File
      </option>

      <option value="26">
        Smaller File
      </option>

    </select>

  </label>


  <button
    id="convert"
    type="button"
    disabled
  >
    Convert for Customer
  </button>


  <div class="progress">
    <div id="bar"></div>
  </div>


  <div id="status">
    Select an AVI video to begin.
  </div>

</div>


<div
  id="result"
  class="card hidden"
>

  <h2>✓ MP4 Ready</h2>

  <div id="resultInfo"></div>

  <button
    id="shareButton"
    class="shareButton"
    type="button"
  >
    Save / Share MP4
  </button>

  <a
    id="downloadLink"
    class="downloadButton"
    style="display:none"
  >
    Save MP4 to Files
  </a>

</div>


<footer>
  Conversion happens on this device.
  Your video is not uploaded to a conversion service.
</footer>

</div>


<!-- FFMPEG.WASM -->

<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>


<script>

"use strict";


/* =========================================
   FFMPEG
========================================= */

const FFmpeg =
  window.FFmpeg.FFmpeg;

const fetchFile =
  window.FFmpegUtil.fetchFile;

const toBlobURL =
  window.FFmpegUtil.toBlobURL;


/* =========================================
   PAGE ELEMENTS
========================================= */

const fileInput =
  document.getElementById("file");

const filename =
  document.getElementById("filename");

const fileDetails =
  document.getElementById("fileDetails");

const convertButton =
  document.getElementById("convert");

const statusText =
  document.getElementById("status");

const progressBox =
  document.querySelector(".progress");

const progressBar =
  document.getElementById("bar");

const resultBox =
  document.getElementById("result");

const resultInfo =
  document.getElementById("resultInfo");

const shareButton =
  document.getElementById("shareButton");

const downloadLink =
  document.getElementById("downloadLink");

const quality =
  document.getElementById("quality");


/* =========================================
   APP STATE
========================================= */

let selectedFile = null;

let ffmpeg = null;

let ffmpegLoaded = false;

let outputBlob = null;

let outputFile = null;

let outputURL = null;


/* =========================================
   HELPERS
========================================= */

function formatBytes(bytes) {

  if (!Number.isFinite(bytes)) {
    return "";
  }

  if (bytes < 1024 * 1024) {

    return Math.max(
      1,
      Math.round(bytes / 1024)
    ) + " KB";

  }

  return (
    bytes / 1024 / 1024
  ).toFixed(1) + " MB";
}


function safeName(name) {

  const cleaned =
    name
      .replace(/\.[^.]+$/, "")
      .replace(/[^a-zA-Z0-9_-]+/g, "_")
      .slice(0, 70);

  return cleaned || "Drain_Video";
}


function clearResult() {

  resultBox.classList.add("hidden");

  outputBlob = null;

  outputFile = null;

  if (outputURL) {

    URL.revokeObjectURL(outputURL);

    outputURL = null;

  }

  downloadLink.style.display = "none";

  downloadLink.removeAttribute("href");
}


/* =========================================
   FILE SELECTION
========================================= */

fileInput.addEventListener(
  "change",
  function() {

    const files =
      fileInput.files;


    if (
      !files ||
      files.length === 0
    ) {

      return;

    }


    selectedFile =
      files[0];


    clearResult();


    /*
      Check the filename rather than MIME type.

      This is intentional because VEVOR AVI
      files may be reported by iOS with an
      unusual MIME type.
    */

    const name =
      selectedFile.name || "";

    const lowerName =
      name.toLowerCase();


    if (
      !lowerName.endsWith(".avi")
    ) {

      selectedFile = null;

      filename.textContent =
        name || "File selected";

      fileDetails.textContent =
        formatBytes(
          files[0].size
        );

      convertButton.disabled =
        true;

      statusText.textContent =
        "Please select an AVI video.";

      alert(
        "That file does not appear to be an AVI video.\n\nPlease select the AVI recording from your VEVOR camera."
      );

      return;

    }


    /*
      SUCCESS
    */

    filename.textContent =
      selectedFile.name;

    fileDetails.textContent =
      formatBytes(
        selectedFile.size
      );


    convertButton.disabled =
      false;


    statusText.textContent =
      "AVI selected. Tap Convert for Customer.";

  }
);


/* =========================================
   LOAD FFMPEG
========================================= */

async function loadConverter() {

  if (ffmpegLoaded) {
    return;
  }


  statusText.textContent =
    "Preparing converter…";


  ffmpeg =
    new FFmpeg();


  ffmpeg.on(
    "log",
    function(data) {

      console.log(
        data.message
      );

    }
  );


  ffmpeg.on(
    "progress",
    function(data) {

      if (
        data &&
        Number.isFinite(
          data.progress
        )
      ) {

        const percent =
          Math.max(
            0,
            Math.min(
              100,
              Math.round(
                data.progress * 100
              )
            )
          );


        progressBox.style.display =
          "block";


        progressBar.style.width =
          percent + "%";


        statusText.textContent =
          "Converting… " +
          percent +
          "%";

      }

    }
  );


  const base =
    "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/umd";


  statusText.textContent =
    "Loading video converter…";


  const coreURL =
    await toBlobURL(
      base + "/ffmpeg-core.js",
      "text/javascript"
    );


  const wasmURL =
    await toBlobURL(
      base + "/ffmpeg-core.wasm",
      "application/wasm"
    );


  await ffmpeg.load({

    coreURL: coreURL,

    wasmURL: wasmURL

  });


  ffmpegLoaded = true;

}


/* =========================================
   CONVERT BUTTON
========================================= */

convertButton.addEventListener(
  "click",
  async function() {

    if (!selectedFile) {
      return;
    }


    convertButton.disabled =
      true;


    clearResult();


    progressBox.style.display =
      "block";


    progressBar.style.width =
      "0%";


    try {

      /*
        Load FFmpeg.
      */

      await loadConverter();


      /*
        Temporary input name.
      */

      const inputName =
        "vevor_input_" +
        Date.now() +
        ".avi";


      /*
        Output filename.
      */

      const outputName =
        safeName(
          selectedFile.name
        ) +
        "_Customer.mp4";


      statusText.textContent =
        "Reading AVI…";


      /*
        Copy AVI into FFmpeg memory.
      */

      const fileData =
        await fetchFile(
          selectedFile
        );


      await ffmpeg.writeFile(
        inputName,
        fileData
      );


      statusText.textContent =
        "Converting video…";


      /*
        H.264 video + AAC audio
        in an MP4 container.

        yuv420p improves compatibility
        with iPhone and Messages.
      */

      await ffmpeg.exec([

        "-i",
        inputName,

        "-map",
        "0:v:0",

        "-map",
        "0:a:0?",

        "-c:v",
        "libx264",

        "-preset",
        "veryfast",

        "-crf",
        quality.value,

        "-pix_fmt",
        "yuv420p",

        "-c:a",
        "aac",

        "-b:a",
        "128k",

        "-movflags",
        "+faststart",

        outputName

      ]);


      statusText.textContent =
        "Preparing MP4…";


      /*
        Read converted video.
      */

      const data =
        await ffmpeg.readFile(
          outputName
        );


      /*
        Make browser Blob.
      */

      outputBlob =
        new Blob(
          [data.buffer],
          {
            type: "video/mp4"
          }
        );


      /*
        Make a real File object.

        This is important for the
        iPhone Share Sheet.
      */

      outputFile =
        new File(
          [outputBlob],
          outputName,
          {
            type: "video/mp4"
          }
        );


      /*
        Create local download URL.
      */

      outputURL =
        URL.createObjectURL(
          outputBlob
        );


      /*
        Set up fallback Save button.
      */

      downloadLink.href =
        outputURL;

      downloadLink.download =
        outputName;

      downloadLink.style.display =
        "block";


      /*
        Display result.
      */

      resultInfo.textContent =
        outputName +
        " • " +
        formatBytes(
          outputBlob.size
        );


      resultBox.classList.remove(
        "hidden"
      );


      progressBar.style.width =
        "100%";


      statusText.textContent =
        "Finished! Your MP4 is ready.";


      /*
        Delete temporary files.
      */

      await ffmpeg
        .deleteFile(inputName)
        .catch(function() {});


      await ffmpeg
        .deleteFile(outputName)
        .catch(function() {});


    } catch (error) {

      console.error(
        "Conversion failed:",
        error
      );


      progressBar.style.width =
        "0%";


      statusText.textContent =
        "Conversion failed.";


      alert(
        "Conversion failed.\n\n" +
        "The VEVOR AVI was selected correctly, but the video could not be converted on this iPhone.\n\n" +
        "Take a screenshot of this message and send it to me."
      );


    } finally {

      convertButton.disabled =
        !selectedFile;

    }

  }
);


/* =========================================
   SHARE MP4
========================================= */

shareButton.addEventListener(
  "click",
  async function() {

    if (!outputFile) {
      return;
    }


    /*
      Use the native iPhone Share Sheet
      when supported.
    */

    try {

      const shareData = {

        files: [outputFile],

        title: outputFile.name,

        text:
          "Drain camera inspection video"

      };


      if (
        navigator.share &&
        navigator.canShare &&
        navigator.canShare(
          shareData
        )
      ) {

        await navigator.share(
          shareData
        );

        return;

      }

    } catch (error) {

      /*
        If the user simply closes the
        Share Sheet, do nothing.
      */

      if (
        error &&
        error.name ===
          "AbortError"
      ) {

        return;

      }

      console.log(
        "Share Sheet unavailable:",
        error
      );

    }


    /*
      Fallback:
      open the MP4 for saving.
    */

    if (outputURL) {

      window.location.href =
        outputURL;

    }

  }
);

</script>

</body>
</html>
