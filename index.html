<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#111827">

<title>Drain Video Converter</title>

<style>
* {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #f3f4f6;
  color: #111827;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;
}

.page {
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
  padding:
    calc(24px + env(safe-area-inset-top))
    18px
    calc(32px + env(safe-area-inset-bottom));
}

.header {
  text-align: center;
  margin-bottom: 28px;
}

.header h1 {
  margin: 0;
  font-size: clamp(34px, 8vw, 54px);
  line-height: 1.05;
  letter-spacing: -1.5px;
}

.header p {
  margin: 14px 0 0;
  color: #667085;
  font-size: clamp(19px, 5vw, 27px);
}

.card {
  background: white;
  border-radius: 28px;
  padding: 30px 22px;
  box-shadow: 0 8px 30px rgba(0,0,0,.08);
}

.file-area {
  position: relative;
  width: 100%;
  height: 150px;
  overflow: hidden;
  border-radius: 24px;
}

.file-button {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #111827;
  color: white;
  font-size: clamp(24px, 6vw, 34px);
  font-weight: 700;
  text-align: center;
  padding: 20px;
}

#fileInput {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  cursor: pointer;
  z-index: 2;
}

.file-info {
  min-height: 58px;
  margin-top: 18px;
  color: #4b5563;
  font-size: 19px;
  line-height: 1.45;
  overflow-wrap: anywhere;
}

.label {
  display: block;
  margin-top: 20px;
  margin-bottom: 10px;
  font-size: 20px;
  font-weight: 700;
}

select {
  width: 100%;
  min-height: 64px;
  padding: 0 18px;
  border: 2px solid #d1d5db;
  border-radius: 18px;
  background: white;
  color: #111827;
  font-size: 19px;
}

button {
  -webkit-appearance: none;
  appearance: none;
}

.convert-button {
  width: 100%;
  min-height: 68px;
  margin-top: 22px;
  border: 0;
  border-radius: 20px;
  background: #315fe8;
  color: white;
  font-size: 24px;
  font-weight: 700;
  padding: 12px 18px;
}

.convert-button:disabled {
  background: #9ca3af;
}

.progress-wrap {
  width: 100%;
  height: 12px;
  margin-top: 28px;
  border-radius: 20px;
  background: #e5e7eb;
  overflow: hidden;
}

.progress-bar {
  width: 0%;
  height: 100%;
  background: #315fe8;
  transition: width .15s ease;
}

.status {
  min-height: 48px;
  margin-top: 20px;
  color: #4b5563;
  font-size: 19px;
  line-height: 1.45;
}

.result {
  display: none;
  margin-top: 20px;
  padding: 20px;
  border-radius: 20px;
  background: #eef6ff;
}

.result-title {
  font-size: 23px;
  font-weight: 700;
  margin-bottom: 10px;
}

.result-name {
  color: #4b5563;
  font-size: 18px;
  line-height: 1.4;
  overflow-wrap: anywhere;
}

.save-button {
  width: 100%;
  min-height: 60px;
  margin-top: 16px;
  border: 0;
  border-radius: 18px;
  background: #111827;
  color: white;
  font-size: 21px;
  font-weight: 700;
}

.notice {
  margin-top: 22px;
  padding: 20px;
  border-radius: 20px;
  background: #f8fafc;
  color: #667085;
  font-size: 17px;
  line-height: 1.5;
}

.footer {
  text-align: center;
  color: #9ca3af;
  font-size: 15px;
  margin-top: 28px;
}

.hidden {
  display: none !important;
}
</style>
</head>

<body>

<div class="page">

  <header class="header">
    <h1>Drain Video Converter</h1>
    <p>VEVOR AVI → Customer MP4</p>
  </header>

  <main class="card">

    <div class="file-area">

      <div class="file-button">
        Choose AVI Video
      </div>

      <input
        id="fileInput"
        type="file"
        accept="*/*"
        aria-label="Choose AVI video"
      >

    </div>

    <div id="fileInfo" class="file-info">
      No AVI selected.
    </div>

    <label
      class="label"
      for="quality"
    >
      Video quality
    </label>

    <select id="quality">
      <option value="20">
        Higher Quality — Larger File
      </option>

      <option value="23" selected>
        Customer — Best Balance
      </option>

      <option value="26">
        Smaller File — Lower Quality
      </option>
    </select>

    <button
      id="convertButton"
      class="convert-button"
      disabled
    >
      Convert for Customer
    </button>

    <div class="progress-wrap">
      <div
        id="progressBar"
        class="progress-bar"
      ></div>
    </div>

    <div
      id="status"
      class="status"
    >
      Select an AVI video to begin.
    </div>

    <div
      id="result"
      class="result"
    >

      <div class="result-title">
        MP4 conversion complete
      </div>

      <div
        id="resultName"
        class="result-name"
      ></div>

      <button
        id="saveButton"
        class="save-button"
      >
        Save / Share MP4
      </button>

    </div>

    <div class="notice">
      Your video is converted directly on this device.
      The AVI is not uploaded to a conversion service.
    </div>

  </main>

  <div class="footer">
    Drain Video Converter
  </div>

</div>


<!--
  IMPORTANT:

  FFmpeg itself is loaded normally with a script tag.

  We are NOT dynamically importing ffmpeg.js.
  This avoids the Safari/Webpack "Automatic publicPath"
  problem that caused the previous version to fail.
-->

<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>

<script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>


<script>
"use strict";


/*
============================================================
CONFIGURATION
============================================================
*/

const CORE_BASE =
  "https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd";


/*
============================================================
PAGE ELEMENTS
============================================================
*/

const fileInput =
  document.getElementById("fileInput");

const fileInfo =
  document.getElementById("fileInfo");

const qualitySelect =
  document.getElementById("quality");

const convertButton =
  document.getElementById("convertButton");

const progressBar =
  document.getElementById("progressBar");

const statusText =
  document.getElementById("status");

const resultBox =
  document.getElementById("result");

const resultName =
  document.getElementById("resultName");

const saveButton =
  document.getElementById("saveButton");


/*
============================================================
STATE
============================================================
*/

let selectedFile = null;

let ffmpeg = null;

let ffmpegLoading = null;

let outputFile = null;

let outputURL = null;


/*
============================================================
HELPERS
============================================================
*/

function setStatus(text) {
  statusText.textContent = text;
}


function setProgress(value) {

  let percent =
    Number(value);

  if (!Number.isFinite(percent)) {
    percent = 0;
  }

  percent =
    Math.max(
      0,
      Math.min(1, percent)
    );

  progressBar.style.width =
    Math.round(percent * 100) + "%";
}


function formatBytes(bytes) {

  if (!Number.isFinite(bytes) || bytes <= 0) {
    return "0 B";
  }

  const units = [
    "B",
    "KB",
    "MB",
    "GB"
  ];

  let value = bytes;
  let index = 0;

  while (
    value >= 1024 &&
    index < units.length - 1
  ) {

    value /= 1024;
    index++;
  }

  return (
    value.toFixed(
      index === 0 ? 0 : 1
    ) +
    " " +
    units[index]
  );
}


function removeExtension(filename) {

  return filename.replace(
    /\.[^/.]+$/,
    ""
  );
}


function isAVI(file) {

  return (
    file &&
    /\.avi$/i.test(file.name)
  );
}


function outputFilename(filename) {

  return (
    removeExtension(filename) +
    "_Customer.mp4"
  );
}


function clearOutput() {

  if (outputURL) {

    URL.revokeObjectURL(
      outputURL
    );

    outputURL = null;
  }

  outputFile = null;

  resultBox.style.display =
    "none";

  resultName.textContent = "";
}


/*
============================================================
BLOB URL HELPER
============================================================

This is the normal ffmpeg.wasm loading method documented
by the project.

There is NO patched ffmpeg.js here.
============================================================
*/

async function toBlobURL(
  url,
  mimeType
) {

  const response =
    await fetch(
      url,
      {
        mode: "cors",
        cache: "force-cache"
      }
    );

  if (!response.ok) {

    throw new Error(
      "Unable to download FFmpeg component (" +
      response.status +
      ")."
    );
  }

  const blob =
    await response.blob();

  return URL.createObjectURL(
    new Blob(
      [blob],
      {
        type: mimeType
      }
    )
  );
}


/*
============================================================
LOAD FFmpeg
============================================================
*/

async function ensureFFmpeg() {

  if (
    ffmpeg &&
    ffmpeg.loaded
  ) {

    return ffmpeg;
  }


  if (ffmpegLoading) {

    return ffmpegLoading;
  }


  ffmpegLoading =
    (async () => {

      setStatus(
        "Loading video converter…"
      );

      setProgress(0);


      /*
        The script tag above creates:

          window.FFmpegWASM

        The utility script creates:

          window.FFmpegUtil
      */

      if (
        !window.FFmpegWASM ||
        !window.FFmpegWASM.FFmpeg
      ) {

        throw new Error(
          "FFmpeg JavaScript library did not load."
        );
      }


      if (
        !window.FFmpegUtil ||
        !window.FFmpegUtil.toBlobURL
      ) {

        throw new Error(
          "FFmpeg utility library did not load."
        );
      }


      const FFmpegClass =
        window.FFmpegWASM.FFmpeg;

      const toBlobURL =
        window.FFmpegUtil.toBlobURL;


      ffmpeg =
        new FFmpegClass();


      /*
        FFmpeg progress.
      */

      ffmpeg.on(
        "progress",
        ({ progress }) => {

          if (
            Number.isFinite(progress)
          ) {

            setProgress(
              progress
            );
          }

        }
      );


      /*
        FFmpeg log is kept in the browser console,
        not displayed to the customer.
      */

      ffmpeg.on(
        "log",
        ({ message }) => {

          console.log(
            "[FFmpeg]",
            message
          );

        }
      );


      setStatus(
        "Downloading video converter engine…"
      );


      /*
        Single-threaded core.

        This is deliberate because it does NOT require
        SharedArrayBuffer or special COOP/COEP headers.
      */

      await ffmpeg.load({

        coreURL:
          await toBlobURL(
            CORE_BASE +
            "/ffmpeg-core.js",
            "text/javascript"
          ),

        wasmURL:
          await toBlobURL(
            CORE_BASE +
            "/ffmpeg-core.wasm",
            "application/wasm"
          )

      });


      setProgress(0);

      setStatus(
        "Converter ready."
      );


      return ffmpeg;

    })();


  try {

    return await ffmpegLoading;

  } catch (error) {

    ffmpegLoading = null;

    ffmpeg = null;

    console.error(
      "FFmpeg loading error:",
      error
    );

    setProgress(0);

    setStatus(
      "Converter could not start."
    );

    throw error;
  }
}


/*
============================================================
FILE SELECTION
============================================================
*/

function handleFileSelection() {

  const file =
    fileInput.files &&
    fileInput.files[0]
      ? fileInput.files[0]
      : null;


  clearOutput();

  selectedFile = null;

  convertButton.disabled =
    true;


  if (!file) {

    fileInfo.textContent =
      "No AVI selected.";

    setStatus(
      "Select an AVI video to begin."
    );

    return;
  }


  /*
    We check the filename instead of MIME type.

    iPhone Files can report an empty or unusual MIME type
    for AVI files.
  */

  if (!isAVI(file)) {

    fileInfo.textContent =
      "Please choose an AVI video.";

    setStatus(
      "That file is not an AVI video."
    );

    alert(
      "Please choose an AVI video."
    );

    return;
  }


  selectedFile = file;


  fileInfo.textContent =
    file.name +
    " • " +
    formatBytes(file.size);


  setStatus(
    "AVI selected. Preparing converter…"
  );


  /*
    Start loading FFmpeg after the user selects
    a file.

    This avoids downloading ~30 MB unnecessarily
    when somebody only opens the page.
  */

  ensureFFmpeg()
    .then(() => {

      if (selectedFile) {

        convertButton.disabled =
          false;

        setStatus(
          "Ready. Tap Convert for Customer."
        );
      }

    })
    .catch((error) => {

      console.error(error);

      alert(
        "The video converter could not start.\n\n" +
        "Please refresh the page and try again."
      );

    });
}


/*
============================================================
IPHONE FILE INPUT
============================================================
*/

fileInput.addEventListener(
  "click",
  () => {

    /*
      Allows selecting the exact same AVI again.
    */

    fileInput.value = "";

  }
);


fileInput.addEventListener(
  "change",
  handleFileSelection
);


/*
============================================================
CONVERSION
============================================================
*/

async function convertVideo() {

  if (!selectedFile) {

    alert(
      "Please choose an AVI video first."
    );

    return;
  }


  if (!isAVI(selectedFile)) {

    alert(
      "Please choose an AVI video."
    );

    return;
  }


  convertButton.disabled =
    true;

  qualitySelect.disabled =
    true;

  fileInput.disabled =
    true;


  clearOutput();

  setProgress(0);


  try {

    const ff =
      await ensureFFmpeg();


    if (!window.FFmpegUtil) {

      throw new Error(
        "FFmpeg utilities are unavailable."
      );
    }


    const fetchFile =
      window.FFmpegUtil.fetchFile;


    if (
      typeof fetchFile !== "function"
    ) {

      throw new Error(
        "FFmpeg file utility is unavailable."
      );
    }


    const inputName =
      "input.avi";

    const outputName =
      "output.mp4";


    setStatus(
      "Loading AVI into converter…"
    );


    const inputData =
      await fetchFile(
        selectedFile
      );


    await ff.writeFile(
      inputName,
      inputData
    );


    const crf =
      Number(
        qualitySelect.value
      ) || 23;


    setStatus(
      "Converting AVI to MP4…"
    );


    setProgress(0);


    /*
      H.264 + AAC.

      yuv420p provides broad compatibility with
      iPhone, Android, Windows and televisions.

      The optional audio map means the conversion
      still works if a camera recording has no audio.
    */

    const exitCode =
      await ff.exec([

        "-i",
        inputName,

        "-map",
        "0:v:0",

        "-map",
        "0:a:0?",

        "-c:v",
        "libx264",

        "-preset",
        "veryfast",

        "-crf",
        String(crf),

        "-pix_fmt",
        "yuv420p",

        "-c:a",
        "aac",

        "-b:a",
        "128k",

        "-movflags",
        "+faststart",

        "-avoid_negative_ts",
        "make_zero",

        outputName

      ]);


    if (
      typeof exitCode === "number" &&
      exitCode !== 0
    ) {

      throw new Error(
        "FFmpeg stopped with code " +
        exitCode
      );
    }


    setStatus(
      "Preparing MP4…"
    );


    const data =
      await ff.readFile(
        outputName
      );


    if (
      !data ||
      data.length === 0
    ) {

      throw new Error(
        "No MP4 file was produced."
      );
    }


    const bytes =
      data instanceof Uint8Array
        ? data
        : new Uint8Array(data);


    const blob =
      new Blob(
        [bytes],
        {
          type: "video/mp4"
        }
      );


    outputFile =
      new File(
        [blob],
        outputFilename(
          selectedFile.name
        ),
        {
          type: "video/mp4"
        }
      );


    outputURL =
      URL.createObjectURL(
        outputFile
      );


    resultName.textContent =
      outputFile.name +
      " • " +
      formatBytes(
        outputFile.size
      );


    resultBox.style.display =
      "block";


    setProgress(1);

    setStatus(
      "Conversion complete."
    );


    /*
      Clean FFmpeg's temporary files.
    */

    try {

      await ff.deleteFile(
        inputName
      );

    } catch (e) {

      console.log(
        "Input cleanup skipped.",
        e
      );
    }


    try {

      await ff.deleteFile(
        outputName
      );

    } catch (e) {

      console.log(
        "Output cleanup skipped.",
        e
      );
    }


  } catch (error) {

    console.error(
      "Conversion failed:",
      error
    );

    setProgress(0);

    setStatus(
      "Conversion failed."
    );

    alert(
      "Conversion failed.\n\n" +
      (
        error &&
        error.message
          ? error.message
          : String(error)
      )
    );

  } finally {

    convertButton.disabled =
      !selectedFile;

    qualitySelect.disabled =
      false;

    fileInput.disabled =
      false;
  }
}


convertButton.addEventListener(
  "click",
  convertVideo
);


/*
============================================================
SAVE / SHARE
============================================================
*/

saveButton.addEventListener(
  "click",
  async () => {

    if (!outputFile) {
      return;
    }


    /*
      iPhone's native share sheet is the preferred
      method because it lets the customer choose
      Save to Files, Messages, Mail, AirDrop, etc.
    */

    if (
      navigator.share &&
      navigator.canShare
    ) {

      try {

        const shareData = {
          files: [outputFile],
          title: outputFile.name
        };


        if (
          navigator.canShare(shareData)
        ) {

          await navigator.share(
            shareData
          );

          return;
        }

      } catch (error) {

        /*
          Closing the share sheet is not an error.
        */

        if (
          error &&
          error.name === "AbortError"
        ) {

          return;
        }

        console.log(
          "Native share unavailable:",
          error
        );
      }
    }


    /*
      Fallback for browsers without file sharing.
    */

    if (outputURL) {

      const link =
        document.createElement("a");

      link.href =
        outputURL;

      link.download =
        outputFile.name;

      link.target =
        "_blank";

      document.body.appendChild(
        link
      );

      link.click();

      link.remove();
    }

  }
);

</script>

</body>
</html>
