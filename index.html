<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#111827">

<title>Drain Video Converter</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f3f4f6;
  color: #111827;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

.container {
  max-width: 650px;
  margin: 0 auto;
  padding: 25px 16px 45px;
}

header {
  text-align: center;
  padding: 10px 0 20px;
}

h1 {
  font-size: 34px;
  line-height: 1.1;
  margin: 5px 0;
}

header p {
  color: #6b7280;
  margin: 8px 0 0;
  font-size: 17px;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 20px;
  margin: 14px 0;
  box-shadow: 0 2px 12px rgba(0,0,0,.08);
}

/* FILE PICKER */

.filePicker {
  position: relative;
  display: block;
  width: 100%;
  overflow: hidden;
  background: #111827;
  color: white;
  border-radius: 15px;
  padding: 18px;
  text-align: center;
  font-weight: 800;
  font-size: 18px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.filePicker:active {
  transform: scale(.99);
}

.filePicker input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  cursor: pointer;
  font-size: 100px;
}

#filename {
  margin-top: 12px;
  color: #6b7280;
  word-break: break-word;
  line-height: 1.4;
}

#fileDetails {
  margin-top: 5px;
  color: #9ca3af;
  font-size: 14px;
}

/* SETTINGS */

label.setting {
  display: block;
  margin: 20px 0;
  font-weight: 600;
}

select {
  width: 100%;
  margin-top: 8px;
  padding: 13px;
  border: 1px solid #d1d5db;
  border-radius: 11px;
  background: white;
  font-size: 16px;
  color: #111827;
}

/* BUTTONS */

button {
  width: 100%;
  border: 0;
  border-radius: 15px;
  padding: 17px;
  font-size: 18px;
  font-weight: 800;
  background: #2563eb;
  color: white;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

button:disabled {
  background: #9ca3af;
  cursor: default;
}

button:active:not(:disabled) {
  transform: scale(.99);
}

.shareButton {
  background: #111827;
  margin-top: 12px;
}

.secondaryButton {
  background: #6b7280;
  margin-top: 12px;
}

/* STATUS */

#status {
  margin-top: 15px;
  color: #4b5563;
  min-height: 25px;
  line-height: 1.4;
}

.progress {
  height: 11px;
  background: #e5e7eb;
  border-radius: 99px;
  overflow: hidden;
  margin-top: 14px;
  display: none;
}

#bar {
  height: 100%;
  width: 0%;
  background: #2563eb;
  transition: width .15s ease;
}

/* RESULT */

.result {
  margin-top: 12px;
}

.result h2 {
  margin-top: 0;
}

#resultInfo {
  color: #4b5563;
  line-height: 1.5;
  word-break: break-word;
}

.hidden {
  display: none !important;
}

footer {
  text-align: center;
  color: #9ca3af;
  font-size: 12px;
  line-height: 1.5;
  margin-top: 22px;
}

/* SMALL SCREEN */

@media (max-width: 400px) {

  h1 {
    font-size: 30px;
  }

  .card {
    padding: 17px;
  }

}

</style>
</head>

<body>

<div class="container">

<header>

  <h1>Drain Video Converter</h1>

  <p>
    VEVOR AVI → Customer MP4
  </p>

</header>


<div class="card">

  <!-- FILE PICKER -->

  <label class="filePicker">

    Choose AVI Video

    <input
      id="file"
      type="file"
      accept=".avi,video/avi,video/x-msvideo,video/*,application/octet-stream"
    >

  </label>


  <div id="filename">
    No video selected
  </div>

  <div id="fileDetails"></div>


  <!-- QUALITY -->

  <label class="setting">

    Video quality

    <select id="quality">

      <option value="23">
        Customer — Best Balance
      </option>

      <option value="20">
        Higher Quality — Larger File
      </option>

      <option value="26">
        Smaller File
      </option>

    </select>

  </label>


  <!-- CONVERT -->

  <button
    id="convert"
    type="button"
    disabled
  >
    Convert for Customer
  </button>


  <!-- PROGRESS -->

  <div class="progress">

    <div id="bar"></div>

  </div>


  <!-- STATUS -->

  <div id="status">
    Select an AVI video to begin.
  </div>

</div>


<!-- RESULT -->

<div
  id="result"
  class="card result hidden"
>

  <h2>
    ✓ MP4 Ready
  </h2>

  <div id="resultInfo"></div>


  <button
    id="shareButton"
    class="shareButton"
    type="button"
  >
    Save / Share MP4
  </button>


  <a
    id="downloadLink"
    class="secondaryButton"
    style="display:none; text-decoration:none; text-align:center;"
  >
    Download MP4
  </a>

</div>


<footer>

  Conversion happens on this device.
  Your video is not uploaded to a conversion service.

</footer>

</div>


<!-- FFMPEG.WASM -->

<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>


<script>

"use strict";


/* ---------------------------------------
   FFMPEG
--------------------------------------- */

const FFmpegClass = window.FFmpeg.FFmpeg;

const fetchFile =
  window.FFmpegUtil.fetchFile;

const toBlobURL =
  window.FFmpegUtil.toBlobURL;


/* ---------------------------------------
   ELEMENTS
--------------------------------------- */

const fileInput =
  document.getElementById("file");

const filename =
  document.getElementById("filename");

const fileDetails =
  document.getElementById("fileDetails");

const convertButton =
  document.getElementById("convert");

const statusText =
  document.getElementById("status");

const progressBox =
  document.querySelector(".progress");

const progressBar =
  document.getElementById("bar");

const resultBox =
  document.getElementById("result");

const resultInfo =
  document.getElementById("resultInfo");

const shareButton =
  document.getElementById("shareButton");

const downloadLink =
  document.getElementById("downloadLink");

const quality =
  document.getElementById("quality");


/* ---------------------------------------
   STATE
--------------------------------------- */

let selectedFile = null;

let ffmpeg = null;

let loaded = false;

let outputBlob = null;

let outputFile = null;

let outputURL = null;


/* ---------------------------------------
   HELPERS
--------------------------------------- */

function formatBytes(bytes) {

  if (!Number.isFinite(bytes)) {
    return "";
  }

  if (bytes < 1024 * 1024) {

    return (
      Math.max(1, Math.round(bytes / 1024))
      + " KB"
    );

  }

  return (
    bytes / 1024 / 1024
  ).toFixed(1) + " MB";
}


function safeName(name) {

  return name
    .replace(/\.[^.]+$/, "")
    .replace(/[^a-zA-Z0-9_-]+/g, "_")
    .slice(0, 70) || "Drain_Video";

}


function resetResult() {

  resultBox.classList.add("hidden");

  outputBlob = null;

  outputFile = null;

  if (outputURL) {

    URL.revokeObjectURL(outputURL);

    outputURL = null;

  }

  downloadLink.style.display = "none";

  downloadLink.removeAttribute("href");

}


/* ---------------------------------------
   FILE PICKER
--------------------------------------- */

/*
   Reset the input before opening it.
   This allows the user to choose the same
   AVI again if necessary.
*/

fileInput.addEventListener(
  "click",
  function() {

    fileInput.value = "";

  }
);


/*
   This is the important iPhone handler.
*/

fileInput.addEventListener(
  "change",
  function() {

    const files = fileInput.files;

    selectedFile =
      files && files.length
        ? files[0]
        : null;


    resetResult();


    if (!selectedFile) {

      filename.textContent =
        "No video selected";

      fileDetails.textContent = "";

      convertButton.disabled = true;

      statusText.textContent =
        "Select an AVI video to begin.";

      return;

    }


    filename.textContent =
      selectedFile.name;


    fileDetails.textContent =
      formatBytes(selectedFile.size);


    convertButton.disabled = false;


    statusText.textContent =
      "AVI selected. Tap Convert for Customer.";

  }
);


/* ---------------------------------------
   LOAD FFMPEG
--------------------------------------- */

async function loadConverter() {

  if (loaded) {

    return;

  }


  statusText.textContent =
    "Preparing converter. The first time may take a minute.";


  ffmpeg =
    new FFmpegClass();


  /*
     FFmpeg log output.
  */

  ffmpeg.on(
    "log",
    function(data) {

      console.log(data.message);

    }
  );


  /*
     Progress indicator.

     ffmpeg.wasm documents progress as
     experimental, so the app also provides
     normal status messages in case progress
     is unavailable.
  */

  ffmpeg.on(
    "progress",
    function(data) {

      if (
        data &&
        Number.isFinite(data.progress)
      ) {

        const percent =
          Math.max(
            0,
            Math.min(
              100,
              Math.round(
                data.progress * 100
              )
            )
          );

        progressBox.style.display =
          "block";

        progressBar.style.width =
          percent + "%";

        statusText.textContent =
          "Converting… " +
          percent +
          "%";

      }

    }
  );


  const base =
    "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/umd";


  /*
     The official ffmpeg.wasm example uses
     toBlobURL to load the core files.
  */

  const coreURL =
    await toBlobURL(
      base + "/ffmpeg-core.js",
      "text/javascript"
    );


  const wasmURL =
    await toBlobURL(
      base + "/ffmpeg-core.wasm",
      "application/wasm"
    );


  await ffmpeg.load({

    coreURL: coreURL,

    wasmURL: wasmURL

  });


  loaded = true;

}


/* ---------------------------------------
   CONVERT
--------------------------------------- */

convertButton.addEventListener(
  "click",
  async function() {

    if (!selectedFile) {

      return;

    }


    convertButton.disabled = true;

    resetResult();


    progressBox.style.display =
      "block";

    progressBar.style.width =
      "0%";


    try {

      /*
         Load converter.
      */

      await loadConverter();


      /*
         Unique temporary input name.
      */

      const inputName =
        "input_" +
        Date.now() +
        ".avi";


      /*
         Customer-friendly output name.
      */

      const outputName =
        safeName(selectedFile.name) +
        "_Customer.mp4";


      statusText.textContent =
        "Reading AVI…";


      /*
         Copy the selected iPhone file
         into ffmpeg's local memory.
      */

      const fileData =
        await fetchFile(selectedFile);


      await ffmpeg.writeFile(
        inputName,
        fileData
      );


      statusText.textContent =
        "Converting video…";


      /*
         Convert to broadly compatible
         H.264 / AAC MP4.

         yuv420p improves compatibility
         with iPhone/iMessage.
      */

      await ffmpeg.exec([

        "-i",
        inputName,

        "-map",
        "0:v:0",

        "-map",
        "0:a:0?",

        "-c:v",
        "libx264",

        "-preset",
        "veryfast",

        "-crf",
        quality.value,

        "-pix_fmt",
        "yuv420p",

        "-c:a",
        "aac",

        "-b:a",
        "128k",

        "-movflags",
        "+faststart",

        outputName

      ]);


      statusText.textContent =
        "Preparing your MP4…";


      /*
         Read the finished MP4.
      */

      const data =
        await ffmpeg.readFile(
          outputName
        );


      outputBlob =
        new Blob(
          [data.buffer],
          {
            type: "video/mp4"
          }
        );


      outputFile =
        new File(
          [outputBlob],
          outputName,
          {
            type: "video/mp4"
          }
        );


      outputURL =
        URL.createObjectURL(
          outputBlob
        );


      /*
         Set up fallback download.
      */

      downloadLink.href =
        outputURL;

      downloadLink.download =
        outputName;

      downloadLink.style.display =
        "block";


      /*
         Show result.
      */

      resultInfo.textContent =
        outputName +
        " • " +
        formatBytes(outputBlob.size);


      resultBox.classList.remove(
        "hidden"
      );


      progressBar.style.width =
        "100%";


      statusText.textContent =
        "Finished! Your MP4 is ready.";


      /*
         Clean temporary FFmpeg files.
      */

      await ffmpeg
        .deleteFile(inputName)
        .catch(function() {});


      await ffmpeg
        .deleteFile(outputName)
        .catch(function() {});


    } catch (error) {

      console.error(
        "Conversion error:",
        error
      );


      progressBar.style.width =
        "0%";


      statusText.textContent =
        "Conversion failed.";


      alert(
        "The AVI could not be converted on this device.\n\n" +
        "Please try the AVI again. If this happens with your VEVOR recordings, send me a screenshot of this message and we will adjust the converter for that camera."
      );


    } finally {

      convertButton.disabled =
        !selectedFile;

    }

  }
);


/* ---------------------------------------
   SAVE / SHARE
--------------------------------------- */

shareButton.addEventListener(
  "click",
  async function() {

    if (!outputFile) {

      return;

    }


    /*
       iPhone/iPad Share Sheet.

       This allows the user to choose
       Messages, Mail, AirDrop, etc.
    */

    try {

      if (
        navigator.share &&
        navigator.canShare
      ) {

        const shareData = {
          files: [outputFile],
          title: outputFile.name,
          text: "Drain camera inspection video"
        };


        if (
          navigator.canShare(shareData)
        ) {

          await navigator.share(
            shareData
          );

          return;

        }

      }

    } catch (error) {

      /*
         User cancelling the Share Sheet
         is not an error we need to display.
      */

      if (
        error &&
        error.name ===
          "AbortError"
      ) {

        return;

      }

      console.log(
        "Share unavailable:",
        error
      );

    }


    /*
       Fallback:
       open/download the MP4.
    */

    if (outputURL) {

      window.open(
        outputURL,
        "_blank"
      );

    }

  }
);

</script>

</body>
</html>
